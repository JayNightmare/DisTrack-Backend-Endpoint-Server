name: _Temp Dump Env
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      DISCORD_CALLBACK_URL: ${{ secrets.DISCORD_CALLBACK_URL }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      LINODE_HOST: ${{ secrets.LINODE_HOST }}
      LINODE_SSH_KEY: ${{ secrets.LINODE_SSH_KEY }}
      LINODE_USER: ${{ secrets.LINODE_USER }}
      NODE_ENV: ${{ secrets.NODE_ENV }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
    steps:
      - name: "dump secrets and vars"
        run: |
          python3 -c "import os; v=os.environ.get('DISCORD_CALLBACK_URL',''); print('BYTES_DISCORD_CALLBACK_URL=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('DISCORD_CLIENT_ID',''); print('BYTES_DISCORD_CLIENT_ID=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('DISCORD_CLIENT_SECRET',''); print('BYTES_DISCORD_CLIENT_SECRET=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('JWT_SECRET',''); print('BYTES_JWT_SECRET=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('LINODE_HOST',''); print('BYTES_LINODE_HOST=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('LINODE_SSH_KEY',''); print('BYTES_LINODE_SSH_KEY=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('LINODE_USER',''); print('BYTES_LINODE_USER=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('NODE_ENV',''); print('BYTES_NODE_ENV=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('SESSION_SECRET',''); print('BYTES_SESSION_SECRET=' + ','.join(str(b) for b in v.encode()))"
